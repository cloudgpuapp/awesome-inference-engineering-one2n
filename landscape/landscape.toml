# Source data for assets/inference-landscape.png.
#
# Each tile must point at the README: `link` is the exact URL of a README
# entry, or a section anchor such as "#kv-cache-basics" for concept tiles.
# A tile shows `logo` if set and the file exists, otherwise a text `badge`
# (defaults to the first letters of `name`) with an optional `sub` line.
#   logo = "gh"         GitHub avatar of the owner in `link`
#   logo = "gh:owner"   GitHub avatar of `owner`
#   logo = "file.png"   file in landscape/logos/
#
# Build:  python3 landscape/build.py [--fetch-logos] [--out PATH]

title = "AI Inference Engineering Landscape"
footer_left = "Illustrative, not exhaustive. Every concept and tool shown links to a README entry. Logos are trademarks of their respective owners."
