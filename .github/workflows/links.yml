name: Link check
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--verbose --no-progress --max-retries 2 --timeout 20 --exclude-path .github --exclude "^https://github.com/org/repo$" "**/*.md"'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
